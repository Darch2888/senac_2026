<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato</title>
</head>
<body>
    <h1>Mensagem</h1>
    <form method="POST" action="/contato">
        <p>
            <label for="name">Nome: </label>
            <input type="text" id="nome" name="nome"/>
        </p>
        <p>
            <label for="email">Email: </label>
            <input type="text" id="email" name="email"/>
        </p>
        <br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
