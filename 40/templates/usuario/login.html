<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro e Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      background-color: #f2f2f2; /* cinza bem claro */
    }
    .form-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px; /* bordas arredondadas */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* leve sombra */
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  
  {% include "header.html" ignore missing %}
  <div class="py-4"><br></div>
  <div class="container-fluid ">
    <div class="row h-100">
      <!-- Tela de Criar Conta -->
      <div class="col-md-1"></div>
      <div class="col-md-10 ">
        <div class="form-container">
          <h3 class="mb-4 text-center">Login</h3>
          <form method="POST" id="frmLogin" onsubmit="usuario_logon(event)">
            <div class="mb-3">
              <label for="login" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="Seu email">
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha">
            </div>
              <button type="submit" class="btn btn-primary btn-sm">Acessar</button>
              <button class="btn btn-secondary btn-sm" onclick="usuario_login_limpar_tela(event)">Limpar</button>
            <br>
            <br>
            <p><span><a href="{{url_for('usuario_routes.rota_usuario_registro')}}">Clique aqui</a> para criar uma nova conta de acesso</span></p>
            <br>
            {% if (messagem != "") %}
            <span>{{mensagem}}</span>
            {% endif %}
          </form>
          <ul>
          </ul>
        </div>
      </div>
      <div class="col-md-1 "></div>
    </div>
  </div>
  
  <script src="{{url_for('static', filename='js/usuario.js')}}"></script>

</body>
</html>
