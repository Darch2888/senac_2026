<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CRUD de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  {% include "header.html" ignore missing %}

  <div class="container">
    <h1>Usuários</h1>

    <!-- Formulário para adicionar ou editar -->
    <form id="frmPerfil" class="mb-4" method="POST" onsubmit="usuario_perfil_atualizar_senha(event)">
      <input type="hidden" id="id">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" id="nome" class="form-control" readonly>
        <label for="email" class="form-label">E-mail:</label>
        <input type="email" id="email" class="form-control" readonly>
        <label for="senha" class="form-label">Senha:</label>
        <input type="password" id="senha" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Atualizar senha</button>
    </form>

  </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{url_for('static', filename='js/usuario.js')}}"></script>
</body>
</html>
