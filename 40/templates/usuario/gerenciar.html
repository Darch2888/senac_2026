<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CRUD de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  {% include "header.html" ignore missing %}
  
  <div class="container">
    <br>
    <h1>Usuários</h1>

    <!-- Formulário para adicionar ou editar -->
    <form id="frmGerencial" method="POST" class="mb-4" onsubmit="usuario_gerenciar_salvar(event)">
      <input type="hidden" id="id">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" id="nome" class="form-control" required>
        <label for="email" class="form-label">E-mail:</label>
        <input type="email" id="email" class="form-control" required>
        <label for="perfil" class="form-label">Perfil:</label>
        <select class="form-select" id="perfil" required>
          <option value="USUARIO">Usuário</option>
          <option value="MODERADOR">Moderador</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-sm" >Salvar</button>
      <button class="btn btn-secondary btn-sm" onclick="usuario_gerenciar_limpar_tela(event)">Limpar</button>
    </form>
    

    <!-- Lista de clientes -->
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Perfil</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaUsuarios"></tbody>
    </table>
  </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{url_for('static', filename='js/usuario.js')}}"></script>
</body>
</html>
