<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Avaliações - {{ filme.titulo }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  {% include "header.html" ignore missing %}
  <br>
  <div class="container py-4">
    <br>
    <div class="row">
      <div class="col-md-3 mb-3">
        <div class="card h-100 shadow-sm">
          <img src="{{ filme.url_poster }}" class="card-img-top" alt="{{ filme.titulo }}">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">{{ filme.titulo }}</h5>
              <p class="card-text">{{ filme.descricao }}</p>
            </div>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted">{{ estrelas }} {{ filme.nota_media }} <br> {{ filme.quantidade_comentarios }} Avaliações</small>
            <a href="{{ url_for('index') }}" class="btn btn-secondary btn-sm mb-3">← Voltar</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 mb-6">
        <div class="card h-100 shadow-sm">
          <div class="card-header">
            <form id="frmAvaliacao" name="frmAvaliacao" onsubmit="avaliacao_registrar_salvar(event)">
              <input type="hidden" id="id_filme" value="{{ filme.id }}">
            {% if "usuario_id" in session %}
              <h5 class="card-title">Avaliações</h5>
              <br>
              <label for="nota" class="form-label">Nota:</label>
              <select class="form-select mb-3" id="nota" required>
                <option value="" selected>Escolha uma nota</option>
                <option value="1">⭐</option>
                <option value="2">⭐⭐</option>
                <option value="3">⭐⭐⭐</option>
                <option value="4">⭐⭐⭐⭐</option>
                <option value="5">⭐⭐⭐⭐⭐</option>
              </select>
              <label for="comentario" class="form-label">Comentário:</label>
              <input type="text" class="form-control mb-3" id="comentario" placeholder="Escreva seu comentário" required>
              <button type="submit" class="btn btn-primary btn-sm" >Salvar</button>
              <button class="btn btn-secondary btn-sm" onclick="avaliacao_registrar_limpar_tela(event)">Limpar</button>
            {% else %}
              <em>Faça login para avaliar</em>
            {% endif %}            
              </form>
          </div>
          <div class="card-body">
            <h5 class="card-title">Nova avaliação</h5>
            <div class="overflow-auto" id="listaAvaliacoes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{url_for('static', filename='js/avaliacao.js')}}"></script>
</body>

</html>
