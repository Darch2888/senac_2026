<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2>Lista de Tarefas</h2>

    <div class="card mb-4">
        <div class="card-header">Cadastro de Tarefa</div>

        <div class="card-body">
            <input type="hidden" id="id">
            <div class="mb-3">
                <label class="form-label">Nome da Tarefa</label>
                <input type="text" class="form-control" id="nome">
            </div>
            <div class="mb-3">
                <label class="form-label">Prioridade</label>
                <select class="form-select" id="prioridade">
                    <option value="1">Baixa</option>
                    <option value="2">Média</option>
                    <option value="3">Alta</option>
                </select>
            </div>

            <button class="btn btn-primary btn-sm" onclick="salvar()">Salvar</button>
            <button class="btn btn-secondary btn-sm" onclick="limparFormulario()">Limpar</button>

        </div>
    </div>

    <div class="mb-3">
        <button class="btn btn-warning btn-sm" onclick="listarPendentes()">Pendentes</button>
        <button class="btn btn-success btn-sm" onclick="listarFinalizadas()">Finalizadas</button>
    </div>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>#</th>
                <th>Tarefa</th>
                <th>Prioridade</th>
                <th>Finalizada</th>
                <th width="300">Ações</th>
            </tr>
        </thead>
        <tbody id="listaTarefas">
        </tbody>
    </table>

</div>

<script src="{{url_for('static', filename='js/tarefa.js')}}"></script>

</body>
</html>
