version: '3.8'

services:
  # Aplicação com build customizado
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senac_custom_app
    ports:
      - "8080:5000"
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASS: root123
      DB_NAME: senac_db
    depends_on:
      - database
    volumes:
      # Monta só o código (para desenvolvimento)
      - ./app.py:/app/app.py

  # Banco de dados
  database:
    image: mysql:8.0
    container_name: senac_custom_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: senac_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
