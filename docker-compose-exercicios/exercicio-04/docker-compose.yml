version: '3.8'

services:
  # Aplicação Python que usa variáveis de ambiente
  app:
    image: python:alpine
    container_name: senac_app
    working_dir: /app
    command: sh -c "pip install flask && python app.py"
    environment:
      # Variáveis diretas
      APP_NAME: "Senac Docker App"
      APP_PORT: 5000

      # Ou com aspas
      APP_ENV: development

      # Referência a variável do host
      MY_HOST_VAR: ${MEU_NOME:-Visitante}
    ports:
      - "${APP_PORT:-8080}:5000"
    volumes:
      - ./app.py:/app/app.py

  # Segundo serviço com variáveis
  worker:
    image: python:alpine
    container_name: senac_worker
    environment:
      - WORKER_NAME=${WORKER:-worker-1}
      - LOG_LEVEL=info
    command: sh -c "echo 'Worker: $$WORKER_NAME, Nível: $$LOG_LEVEL' && sleep 3600"
