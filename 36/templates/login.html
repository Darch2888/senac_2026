<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Registro e Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
    }
    .container {
      display: flex;
      justify-content: space-between;
      gap: 40px;
    }
    .form-box {
      flex: 1;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .form-box h2 {
      margin-bottom: 15px;
    }
    .form-box label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-box input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .form-box button {
      width: 100%;
      padding: 10px;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .form-box button:hover {
      background-color: #0056b3;
    }
    .message-box {
      margin-top: 30px;
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      background-color: #e9ecef;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Formulário de Registro -->
    <div class="form-box">
      <h2>Registro</h2>
      <form id="form-registro" method="POST" action="/registro">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="login-reg">Login:</label>
        <input type="text" id="login-reg" name="login" required>

        <label for="senha-reg">Senha:</label>
        <input type="password" id="senha-reg" name="senha" required>

        <button type="submit">Registrar</button>
      </form>
    </div>

    <!-- Formulário de Login -->
    <div class="form-box">
      <h2>Login</h2>
      <form id="form-login" method="POST", action="/login">
        <label for="login-login">Login:</label>
        <input type="text" id="login-login" name="login" required>

        <label for="senha-login">Senha:</label>
        <input type="password" id="senha-login" name="senha" required>

        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Área de mensagens -->
  <div class="message-box" id="mensagem">
    {{ mensagem }}
  </div>

</body>
</html>
