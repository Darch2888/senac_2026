<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro e Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      background-color: #f2f2f2; /* cinza bem claro */
    }
    .form-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px; /* bordas arredondadas */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* leve sombra */
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container-fluid split-screen">
    <div class="row h-100">
      <div class="col-md-1"></div>
      <!-- Tela de Criar Conta -->
      <div class="col-md-10">
        <div class="form-container">
          <h3 class="mb-4 text-center">Criar Nova Conta</h3>
          <form method="POST" id="frmRegistro" onsubmit="usuario_registrar_salvar(event)">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            <div class="mb-3">
              <label for="login" class="form-label">Login</label>
              <input type="text" class="form-control" id="login" name="login" placeholder="Seu login" required>
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary btn-sm" >Salvar</button>
            <button class="btn btn-secondary btn-sm" onclick="usuario_registrar_limpar_tela(event)">Limpar</button>
          </form>
          <br>
          <p><span>{{mensagem}}</span></p>
          <p><span><a href="{{url_for('usuario_routes.rota_usuario_login')}}">Clique aqui</a> para acessar a tela de login</span></p>
        </div>
      </div>
      <div class="col-md-1"></div>
    </div>
  </div>
  <script src="{{url_for('static', filename='js/usuario.js')}}"></script>
</body>
</html>
