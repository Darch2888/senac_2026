<html>
    <head></head>
    <body>
        <table>
            <tread>
                <tr>
                    <td>id</td>
                    <td>nome</td>
                    <td>preco</td>
                </tr>
            </tread>
            <tbody id="tabela">

            </tbody>
        </table>
    </body>
    <script>
        const API_URL = "http://127.0.0.1:5000";
        const tabela = document.getElementById("tabela")

        async function carregarProduto() {
            const response = await fetch(API_URL + '/produto')
            const produtos = await response.json()

            tabela.innerHTML = "";
            produtos.forEach(produto => {
                tabela.innerHTML += `
                    <tr>
                        <td>${produto.id}</td>
                        <td>${produto.nome}</td>
                        <td>${produto.preco}</td>
                    </tr>
                `;
            });
        }

        carregarProduto();
    </script>
</html>
